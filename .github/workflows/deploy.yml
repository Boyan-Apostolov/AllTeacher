name: Deploy

on:
  push:
    branches:
      - main
      - final-deployment

jobs:
  deploy-website:
    runs-on: self-hosted
    environment: website

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (FROM WEBSITE)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/allteacher-website ./AllTeacher/website

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/allteacher-website

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull bobby156/allteacher-website:latest || true

            docker stop allteacher-website || true
            docker rm allteacher-website || true

            docker run -d \
              --name allteacher-website \
              -p 3000:80 \
              bobby156/allteacher-website:latest
          EOF

  trigger-xcode-cloud:
    runs-on: ubuntu-latest
    environment: ios

    steps:
      - name: Trigger Xcode Cloud Build
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          XCODE_CLOUD_WORKFLOW_ID: ${{ secrets.XCODE_CLOUD_WORKFLOW_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 -m pip install PyJWT cryptography requests --quiet
          python3 - << 'EOF'
          import jwt, time, requests, sys, os

          private_key = os.environ["ASC_PRIVATE_KEY"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_id = os.environ["ASC_KEY_ID"]
          workflow_id = os.environ["XCODE_CLOUD_WORKFLOW_ID"]
          branch_name = os.environ["BRANCH_NAME"]

          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id}
          )

          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # Find the git reference ID for the current branch
          wf_resp = requests.get(
              f"https://api.appstoreconnect.apple.com/v1/ciWorkflows/{workflow_id}?include=repository",
              headers=headers
          )
          wf_resp.raise_for_status()
          repo_id = wf_resp.json()["data"]["relationships"]["repository"]["data"]["id"]

          refs_resp = requests.get(
              f"https://api.appstoreconnect.apple.com/v1/scmRepositories/{repo_id}/gitReferences",
              headers=headers
          )
          refs_resp.raise_for_status()

          branch_ref_id = None
          for ref in refs_resp.json()["data"]:
              if ref["attributes"]["name"] == branch_name and ref["attributes"]["kind"] == "BRANCH":
                  branch_ref_id = ref["id"]
                  break

          if not branch_ref_id:
              print(f"Branch '{branch_name}' not found in Xcode Cloud repository")
              sys.exit(1)

          # Trigger build on the correct branch
          resp = requests.post(
              "https://api.appstoreconnect.apple.com/v1/ciBuildRuns",
              headers=headers,
              json={
                  "data": {
                      "type": "ciBuildRuns",
                      "relationships": {
                          "workflow": {"data": {"type": "ciWorkflows", "id": workflow_id}},
                          "sourceBranchOrTag": {"data": {"type": "scmGitReferences", "id": branch_ref_id}}
                      }
                  }
              }
          )

          if resp.status_code not in (200, 201):
              print(f"Failed to trigger build: {resp.status_code}")
              print(resp.text)
              sys.exit(1)

          print(f"Xcode Cloud build triggered for branch '{branch_name}'.")
          EOF

  push-backend:
    runs-on: ubuntu-latest
    environment: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (FROM BACKEND)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/allteacher-backend ././AllTeacher/backend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/allteacher-backend

  deploy-backend:
    runs-on: self-hosted
    needs: push-backend

    steps:
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull bobby156/allteacher-backend:latest || true

            docker stop allteacher || true
            docker rm allteacher || true

            docker run -d \
              --name allteacher \
              -p 8000:8000 \
              --env-file /root/allteacher/.env \
              bobby156/allteacher-backend:latest
          EOF
