name: Deploy

on:
  push:
    branches:
      - main
      - final-deployment
    paths-ignore:
      - "AllTeacher/ios/ios/**"

jobs:
  deploy-website:
    runs-on: self-hosted
    environment: website

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (FROM WEBSITE)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/allteacher-website ./AllTeacher/website

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/allteacher-website

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull bobby156/allteacher-website:latest || true

            docker stop allteacher-website || true
            docker rm allteacher-website || true

            docker run -d \
              --name allteacher-website \
              -p 3000:80 \
              bobby156/allteacher-website:latest
          EOF

  deploy-backend:
    runs-on: self-hosted
    environment: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug key
        run: echo "${{ secrets.SERVER_SSH_KEY }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (FROM BACKEND)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/allteacher-backend ././AllTeacher/backend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/allteacher-backend

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull bobby156/allteacher-backend:latest || true

            docker stop allteacher || true
            docker rm allteacher || true

            docker run -d \
              --name allteacher \
              -p 8000:8000 \
              --env-file /root/allteacher/.env \
              bobby156/allteacher-backend:latest
          EOF

  prebuild-ios:
    runs-on: self-hosted
    environment: ios
    permissions:
      contents: write
    defaults:
      run:
        working-directory: AllTeacher/ios

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AllTeacher/ios/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: Setup SSH for push
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add GitHub to known hosts
        run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Commit ios/ folder to main
        run: |
          git config user.email "ci@allteacher.app"
          git config user.name "AllTeacher CI"
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git add -f ios/
          git diff --staged --quiet || git commit -m "chore: prebuild ios [skip ci]"
          BRANCH=$(git branch --show-current)
          LOCAL_SHA=$(git rev-parse HEAD)

          push_succeeded() {
            git fetch origin "$BRANCH"
            REMOTE_SHA=$(git rev-parse "origin/$BRANCH" 2>/dev/null || echo "none")
            [ "$LOCAL_SHA" = "$REMOTE_SHA" ]
          }

          PUSHED=false
          for i in 1 2 3; do
            git push origin HEAD || true
            if push_succeeded; then
              echo "Push confirmed on remote."
              PUSHED=true
              break
            fi
            echo "Push attempt $i not confirmed on remote, retrying in 15s..."
            sleep 15
          done

          if [ "$PUSHED" = false ]; then
            echo "All push attempts failed — commit not found on remote."
            exit 1
          fi
